spring.application.name=sourcing-platform
spring.profiles.default=local
server.address=127.0.0.1
server.port=8080
server.servlet.session.timeout=2h
server.servlet.session.cookie.name=SOURCING_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
spring.config.import=optional:file:./data/mysql-local.properties,optional:file:./data/vendor-local.properties
spring.datasource.url=${SOURCING_DB_URL:jdbc:mysql://127.0.0.1:3306/sourcing_platform?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${SOURCING_DB_USERNAME:sourcing_app}
spring.datasource.password=${SOURCING_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
server.error.include-message=never
server.error.include-stacktrace=never
vendor.enabled=${VENDOR_ENABLED:false}
